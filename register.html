{% extends "base.html" %}{% block body %}
<div class="card"><h1>Create account</h1><p class="sub">Register to upload and share documents.</p>
<form method="post"><label>Full name</label><input name="name" required>
<label>Company</label><input name="company" required>
<label>Email</label><input type="email" name="email" required>
<label>Password (6+ characters)</label><input type="password" name="password" required minlength="6">
<label>Role</label><select name="role"><option value="owner">Owner – upload, share, delete own documents</option>
<option value="viewer">Viewer – open documents shared with me</option></select><br><br>
<button style="width:100%">Create account</button></form>
<p class="sub" style="margin:16px 0 0">Have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
